AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Intent Guardian backend MVP - authenticated API, AWS inventory, intent constraints and evaluations.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: ../INTEGRATION.md
        has: Contract and Academy constraints
        scope: project

Parameters:
  EnableEvidenceSources:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Optional read-only existing Flow Logs and Reachability Analyzer evidence. Never creates or runs analyses.
  FlowLogsGroupName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[.\-_/#A-Za-z0-9]+$'
    Description: Existing VPC Flow Logs group using the default 14-field format.
  CrossValidationPathsJson:
    Type: String
    Default: '{}'
    Description: Reviewed JSON mapping sourceId|targetId to an existing NetworkInsightsPathId.
  RemediationEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  RemediationDryRun:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
  EnableLLM:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
  BedrockModelId:
    Type: String
    Default: ''
    Description: Explicit region-supported model ID. No default model or cross-region inference.
  BedrockModelArn:
    Type: String
    Default: arn:aws:bedrock:us-east-1::foundation-model/NOTCONFIGURED
    AllowedPattern: '^arn:aws[a-zA-Z-]*:bedrock:[a-z0-9-]+:[0-9]*:(foundation-model|inference-profile)/[a-zA-Z0-9.:-]+$'
    Description: Exact reviewed model ARN for optional InvokeModel permission.
  EnableAsyncWorker:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Optional DynamoDB Streams evaluation worker; local jobs use the explicit local runner.
  ExistingExecutionRoleArn:
    Type: String
    Default: arn:aws:iam::000000000000:role/NOT_CONFIGURED
    AllowedPattern: '^arn:aws[a-zA-Z-]*:iam::[0-9]{12}:role/[a-zA-Z_0-9+=,.@\-_/]+$'
    Description: Optional pre-approved Academy execution role; policies must already exist and PassRole must be allowed.
  EnableConfig:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Optional Config readiness probe. Does not create a recorder.
  EnableLambdaInventory:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Optional read-only Lambda discovery; access denial degrades coverage.
  EnableTagInventory:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Optional extra tag reads for resource selectors.
  StageName:
    Type: String
    Default: dev
    AllowedValues: [dev, demo]
    Description: Deployment stage. Use dev for initial testing.
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact frontend origin permitted by API CORS. Change to the deployed frontend origin later.
  CognitoCallbackUrl:
    Type: String
    Default: http://localhost:5173/
    Description: Exact frontend OAuth callback URL including the trailing slash.
  CognitoLogoutUrl:
    Type: String
    Default: http://localhost:5173/login
    Description: Exact frontend OAuth sign-out return URL.

Rules:
  BedrockConfigurationRequired:
    RuleCondition: !Equals [!Ref EnableLLM, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref BedrockModelId, '']]
        AssertDescription: Optional Bedrock escalation requires an explicit reviewed model ID.
      - Assert: !Not [!Equals [!Ref BedrockModelArn, 'arn:aws:bedrock:us-east-1::foundation-model/NOTCONFIGURED']]
        AssertDescription: Optional Bedrock escalation requires an exact model permission ARN.

Conditions:
  EvidenceSourcesEnabled: !Equals [!Ref EnableEvidenceSources, 'true']
  RemediationWritesEnabled: !And [!Equals [!Ref RemediationEnabled, 'true'], !Equals [!Ref RemediationDryRun, 'false']]
  LLMEnabled: !Equals [!Ref EnableLLM, 'true']
  AsyncWorkerEnabled: !Equals [!Ref EnableAsyncWorker, 'true']
  UseExistingRole: !Not [!Equals [!Ref ExistingExecutionRoleArn, 'arn:aws:iam::000000000000:role/NOT_CONFIGURED']]
  ConfigEnabled: !Equals [!Ref EnableConfig, 'true']
  LambdaInventoryEnabled: !Equals [!Ref EnableLambdaInventory, 'true']
  TagInventoryEnabled: !Equals [!Ref EnableTagInventory, 'true']

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    Timeout: 25
    MemorySize: 256
    Environment:
      Variables:
        STAGE_NAME: !Ref StageName
        # Empty in AWS; overridden only by the local SAM environment file.
        DYNAMODB_ENDPOINT_URL: ''
        CIG_LOCAL: 'false'
        # Fixture observations require a separate local-only override; never use cloud credentials locally.
        INVENTORY_PROVIDER: aws
        CIG_FIXTURE_SCENARIO: benign
        TOPOLOGY_ENABLED: 'true'
        CIG_ACCOUNT_ID: !Ref AWS::AccountId
        CIG_LOCAL_ROLE: admin
        REMEDIATIONS_TABLE: !Ref RemediationsTable
        REMEDIATION_ENABLED: !Ref RemediationEnabled
        REMEDIATION_DRY_RUN: !Ref RemediationDryRun
        CROSS_VALIDATION_ENABLED: !Ref EnableEvidenceSources
        FLOW_LOGS_GROUP_NAME: !Ref FlowLogsGroupName
        CROSS_VALIDATION_PATHS_JSON: !Ref CrossValidationPathsJson
        LLM_ENABLED: !Ref EnableLLM
        LLM_PROVIDER: bedrock
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        ASYNC_WORKER_ENABLED: !Ref EnableAsyncWorker
        INTENT_VERSIONS_TABLE: !Ref IntentVersionsTable
        AUDIT_TABLE: !Ref AuditEventsTable
        EVALUATION_ARTIFACTS_TABLE: !Ref EvaluationArtifactsTable
        CONFIG_ENABLED: !Ref EnableConfig
        LAMBDA_INVENTORY_ENABLED: !Ref EnableLambdaInventory
        TAG_INVENTORY_ENABLED: !Ref EnableTagInventory

Resources:
  # Cognito sign-up is admin-only so public visitors cannot create accounts to inspect your AWS inventory.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub cloud-intent-guardian-${StageName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  ViewerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: viewer
      UserPoolId: !Ref UserPool
  ApproverGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: approver
      UserPoolId: !Ref UserPool
  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: admin
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub cloud-intent-guardian-${StageName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref CognitoCallbackUrl]
      LogoutURLs: [!Ref CognitoLogoutUrl]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub cig-${AWS::AccountId}-${AWS::Region}-${StageName}
      ManagedLoginVersion: 1

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: Cloud Intent Guardian API
          version: '1.0'
        paths: {}
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient

  IntentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloud-intent-guardian-${StageName}-intents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: intentId
          AttributeType: S
      KeySchema:
        - AttributeName: intentId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  IntentVersionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub cloud-intent-guardian-${StageName}-intent-versions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: intentId, AttributeType: S}
        - {AttributeName: version, AttributeType: N}
      KeySchema:
        - {AttributeName: intentId, KeyType: HASH}
        - {AttributeName: version, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}

  AuditEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub cloud-intent-guardian-${StageName}-audit
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: auditId, AttributeType: S}
        - {AttributeName: scopeKey, AttributeType: S}
        - {AttributeName: eventOrder, AttributeType: S}
      KeySchema:
        - {AttributeName: auditId, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: scope-time
          KeySchema:
            - {AttributeName: scopeKey, KeyType: HASH}
            - {AttributeName: eventOrder, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      SSESpecification: {SSEEnabled: true}

  EvaluationArtifactsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub cloud-intent-guardian-${StageName}-evaluation-artifacts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: evaluationId, AttributeType: S}
        - {AttributeName: artifactKey, AttributeType: S}
      KeySchema:
        - {AttributeName: evaluationId, KeyType: HASH}
        - {AttributeName: artifactKey, KeyType: RANGE}
      SSESpecification: {SSEEnabled: true}

  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloud-intent-guardian-${StageName}-findings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: findingId
          AttributeType: S
        - AttributeName: scopeIntentKey
          AttributeType: S
      GlobalSecondaryIndexes:
        - IndexName: scope-intent
          KeySchema:
            - {AttributeName: scopeIntentKey, KeyType: HASH}
            - {AttributeName: findingId, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      KeySchema:
        - AttributeName: findingId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  EvaluationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloud-intent-guardian-${StageName}-evaluations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: evaluationId
          AttributeType: S
        - AttributeName: scopeKey
          AttributeType: S
        - AttributeName: createdOrder
          AttributeType: S
      StreamSpecification: !If [AsyncWorkerEnabled, {StreamViewType: NEW_IMAGE}, !Ref AWS::NoValue]
      GlobalSecondaryIndexes:
        - IndexName: scope-created
          KeySchema:
            - {AttributeName: scopeKey, KeyType: HASH}
            - {AttributeName: createdOrder, KeyType: RANGE}
          Projection: {ProjectionType: ALL}
      KeySchema:
        - AttributeName: evaluationId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: health.app.lambda_handler
      Description: Public liveness endpoint only; returns no account details.
      Events:
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/health
            Method: GET
            Auth:
              Authorizer: NONE

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: status.app.lambda_handler
      Description: Authenticated AWS account and source readiness status.
      Policies:
        - Statement:
            - Effect: Allow
              Action: sts:GetCallerIdentity
              Resource: '*'
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - rds:DescribeDBInstances
                - s3:ListAllMyBuckets
              Resource: '*'
        - !If
          - ConfigEnabled
          - Statement:
              - Effect: Allow
                Action: [config:DescribeConfigurationRecorders, config:DescribeConfigurationRecorderStatus]
                Resource: '*'
          - !Ref AWS::NoValue
      Events:
        StatusRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/system/status
            Method: GET

  ResourcesFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: resources.app.lambda_handler
      Description: Read-only inventory from EC2, VPC, security groups, RDS and S3 APIs.
      # Intent comparison is a read; this function must never change intent or AWS resources.
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IntentVersionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref IntentsTable
        - Statement:
            - Effect: Allow
              Action:
                - sts:GetCallerIdentity
                - ec2:DescribeInstances
                - ec2:DescribeVpcs
                - ec2:DescribeSubnets
                - ec2:DescribeSecurityGroups
                - rds:DescribeDBInstances
                - rds:DescribeDBSubnetGroups
                - s3:ListAllMyBuckets
                - s3:GetBucketLocation
                - s3:GetBucketPublicAccessBlock
                - s3:GetBucketPolicyStatus
              Resource: '*'
        - !If
          - LambdaInventoryEnabled
          - Statement:
              - Effect: Allow
                Action: [lambda:ListFunctions]
                Resource: '*'
          - !Ref AWS::NoValue
        - !If
          - TagInventoryEnabled
          - Statement:
              - Effect: Allow
                Action: [rds:ListTagsForResource, s3:GetBucketTagging]
                Resource: '*'
          - !Ref AWS::NoValue
      Events:
        ResourcesRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/resources
            Method: GET
            TimeoutInMillis: 29000
        GraphRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/architecture/graph
            Method: GET
            TimeoutInMillis: 29000

  ViewsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: views.app.lambda_handler
      Description: Stored findings detail and dashboard summary without live discovery.
      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTable
          EVALUATIONS_TABLE: !Ref EvaluationsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FindingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EvaluationsTable
        - DynamoDBReadPolicy:
            TableName: !Ref RemediationsTable
      Events:
        DashboardRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/dashboard/summary
            Method: GET
        FindingDetailRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/findings/{findingId}
            Method: GET

  FindingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: findings.app.lambda_handler
      Description: Lists stored findings with cursor pagination.
      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditEventsTable.Arn
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt FindingsTable.Arn
        - DynamoDBReadPolicy:
            TableName: !Ref FindingsTable
      Events:
        UpdateFindingRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/findings/{findingId}
            Method: PATCH
        FindingsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/findings
            Method: GET

  IntentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: intents.app.lambda_handler
      Description: Lists and creates draft JSON intent manifests.
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IntentVersionsTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditEventsTable.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref IntentsTable
      Events:
        ListIntentsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/intents
            Method: GET
        CreateIntentRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/intents
            Method: POST

  IntentDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: intent_detail.app.lambda_handler
      Description: Retrieves one intent manifest.
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IntentsTable
      Events:
        IntentDetailRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/intents/{intentId}
            Method: GET

  ApproveIntentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: approve_intent.app.lambda_handler
      Description: Explicitly approves a validated draft intent.
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IntentVersionsTable
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditEventsTable.Arn
        - DynamoDBCrudPolicy:
            TableName: !Ref IntentsTable
      Events:
        ApproveIntentRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/intents/{intentId}/approve
            Method: POST

  EvaluationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: evaluations.app.lambda_handler
      Description: Queues evaluations and reads scoped history; collection runs only in the worker.
      Timeout: 29
      MemorySize: 512
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
          FINDINGS_TABLE: !Ref FindingsTable
          EVALUATIONS_TABLE: !Ref EvaluationsTable
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref IntentsTable}
        - DynamoDBReadPolicy: {TableName: !Ref IntentVersionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref EvaluationsTable}
        - DynamoDBReadPolicy: {TableName: !Ref EvaluationArtifactsTable}
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditEventsTable.Arn
      Events:
        EvaluationListRoute:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /v1/evaluations, Method: GET}
        EvaluationDetailRoute:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: '/v1/evaluations/{id}', Method: GET}
        RunEvaluationRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/evaluations
            Method: POST
            TimeoutInMillis: 29000

  VersionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: versions.app.lambda_handler
      Description: Immutable intent versions and explicitly approved baseline pointer changes.
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref IntentsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref IntentVersionsTable}
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditEventsTable.Arn
      Events:
        VersionList: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/v1/intents/{intentId}/versions', Method: GET}}
        VersionCreate: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/v1/intents/{intentId}/versions', Method: POST}}
        VersionDetail: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/v1/intents/{intentId}/versions/{version}', Method: GET}}
        VersionApprove: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/v1/intents/{intentId}/versions/{version}/approve', Method: POST}}
        VersionRollback: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/v1/intents/{intentId}/rollback', Method: POST}}
        VersionDiff: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/v1/intents/{intentId}/diff', Method: GET}}

  AuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: audit.app.lambda_handler
      Description: Read-only scoped audit history with cursor pagination.
      Policies:
        - DynamoDBReadPolicy: {TableName: !Ref AuditEventsTable}
      Events:
        AuditList: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /v1/audit, Method: GET}}

  EvaluationWorkerFunction:
    Type: AWS::Serverless::Function
    Condition: AsyncWorkerEnabled
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: evaluation_worker.app.lambda_handler
      Description: Idempotent queued evaluation worker; optional Academy transport, no automatic remediation.
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
          FINDINGS_TABLE: !Ref FindingsTable
          EVALUATIONS_TABLE: !Ref EvaluationsTable
      Policies:
        - !If
          - EvidenceSourcesEnabled
          - Statement:
              - Effect: Allow
                Action: [ec2:DescribeNetworkInsightsPaths, ec2:DescribeNetworkInsightsAnalyses]
                Resource: '*'
              - Effect: Allow
                Action: logs:FilterLogEvents
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${FlowLogsGroupName}:*
          - !Ref AWS::NoValue
        - !If
          - LLMEnabled
          - Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref BedrockModelArn
          - !Ref AWS::NoValue
        - DynamoDBCrudPolicy: {TableName: !Ref IntentsTable}
        - DynamoDBReadPolicy: {TableName: !Ref IntentVersionsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref FindingsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref EvaluationsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref EvaluationArtifactsTable}
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem]
              Resource: !GetAtt AuditEventsTable.Arn
            - Effect: Allow
              Action: [dynamodb:DescribeStream, dynamodb:GetRecords, dynamodb:GetShardIterator, dynamodb:ListStreams]
              Resource: !GetAtt EvaluationsTable.StreamArn
            - Effect: Allow
              Action: [sts:GetCallerIdentity, ec2:DescribeInstances, ec2:DescribeVpcs, ec2:DescribeSubnets, ec2:DescribeSecurityGroups, rds:DescribeDBInstances, rds:DescribeDBSubnetGroups, s3:ListAllMyBuckets, s3:GetBucketLocation, s3:GetBucketPublicAccessBlock, s3:GetBucketPolicyStatus]
              Resource: '*'
        - !If
          - LambdaInventoryEnabled
          - Statement:
              - Effect: Allow
                Action: lambda:ListFunctions
                Resource: '*'
          - !Ref AWS::NoValue
        - !If
          - TagInventoryEnabled
          - Statement:
              - Effect: Allow
                Action: [rds:ListTagsForResource, s3:GetBucketTagging]
                Resource: '*'
          - !Ref AWS::NoValue
      Events:
        QueuedEvaluation:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt EvaluationsTable.StreamArn
            StartingPosition: LATEST
            BatchSize: 1
            MaximumRetryAttempts: 2
            MaximumRecordAgeInSeconds: 3600
            FilterCriteria:
              Filters:
                - Pattern: '{"eventName":["INSERT"],"dynamodb":{"NewImage":{"status":{"S":["QUEUED"]}}}}'

  RemediationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      SSESpecification: {SSEEnabled: true}
      AttributeDefinitions:
        - {AttributeName: proposalId, AttributeType: S}
        - {AttributeName: scopeKey, AttributeType: S}
        - {AttributeName: createdOrder, AttributeType: S}
      KeySchema: [{AttributeName: proposalId, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: scope-created
          KeySchema: [{AttributeName: scopeKey, KeyType: HASH}, {AttributeName: createdOrder, KeyType: RANGE}]
          Projection: {ProjectionType: ALL}

  RemediationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      Role: !If [UseExistingRole, !Ref ExistingExecutionRoleArn, !Ref AWS::NoValue]
      CodeUri: src/
      Handler: remediations.app.lambda_handler
      Description: Human-approved reversible registry proposals with dry-run execution by default.
      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTable
      Policies:
        - Statement:
            - Effect: Allow
              Action: dynamodb:ConditionCheckItem
              Resource: !GetAtt FindingsTable.Arn
        - DynamoDBReadPolicy: {TableName: !Ref FindingsTable}
        - DynamoDBCrudPolicy: {TableName: !Ref RemediationsTable}
        - Statement:
            - Effect: Allow
              Action: dynamodb:PutItem
              Resource: !GetAtt AuditEventsTable.Arn
        - !If
          - RemediationWritesEnabled
          - Statement:
              - Effect: Allow
                Action: [sts:GetCallerIdentity, ec2:DescribeSecurityGroups]
                Resource: '*'
              - Effect: Allow
                Action: ec2:RevokeSecurityGroupIngress
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/*
              - Effect: Allow
                Action: [s3:GetBucketPublicAccessBlock, s3:PutBucketPublicAccessBlock]
                Resource: !Sub arn:${AWS::Partition}:s3:::*
          - !Ref AWS::NoValue
      Events:
        ProposalList: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /v1/remediations, Method: GET}}
        ProposalCreate: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: /v1/remediations, Method: POST}}
        ProposalDetail: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/v1/remediations/{proposalId}', Method: GET}}
        ProposalApprove: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/v1/remediations/{proposalId}/approve', Method: POST}}
        ProposalExecute: {Type: HttpApi, Properties: {ApiId: !Ref Api, Path: '/v1/remediations/{proposalId}/execute', Method: POST}}

Outputs:
  ApiUrl:
    Description: Base URL for the Cloud Intent Guardian API.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  AwsRegion:
    Description: AWS Region used by this deployment.
    Value: !Ref AWS::Region
  CognitoUserPoolId:
    Description: Cognito User Pool ID used by the frontend.
    Value: !Ref UserPool
  CognitoUserPoolClientId:
    Description: Cognito public web client ID (not a secret).
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Public Cognito hosted login domain for the frontend OAuth flow.
    Value: !Sub '${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  IntentsTableName:
    Value: !Ref IntentsTable
  FindingsTableName:
    Value: !Ref FindingsTable
  EvaluationsTableName:
    Value: !Ref EvaluationsTable
  IntentVersionsTableName:
    Value: !Ref IntentVersionsTable
  AuditEventsTableName:
    Value: !Ref AuditEventsTable
  EvaluationArtifactsTableName:
    Value: !Ref EvaluationArtifactsTable
