AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Cloud Intent Guardian backend MVP - authenticated API, AWS inventory, intent constraints and evaluations.

Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@3
  com.aws.cloudformation.Context:
    ref:
      - at: ../INTEGRATION.md
        has: Contract and Academy constraints
        scope: project

Parameters:
  EnableConfig:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Optional Config readiness probe. Does not create a recorder.
  EnableLambdaInventory:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Optional read-only Lambda discovery; access denial degrades coverage.
  EnableTagInventory:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Optional extra tag reads for resource selectors.
  StageName:
    Type: String
    Default: dev
    AllowedValues: [dev, demo]
    Description: Deployment stage. Use dev for initial testing.
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Exact frontend origin permitted by API CORS. Change to the deployed frontend origin later.
  CognitoCallbackUrl:
    Type: String
    Default: http://localhost:5173/
    Description: Exact frontend OAuth callback URL including the trailing slash.
  CognitoLogoutUrl:
    Type: String
    Default: http://localhost:5173/login
    Description: Exact frontend OAuth sign-out return URL.

Conditions:
  ConfigEnabled: !Equals [!Ref EnableConfig, 'true']
  LambdaInventoryEnabled: !Equals [!Ref EnableLambdaInventory, 'true']
  TagInventoryEnabled: !Equals [!Ref EnableTagInventory, 'true']

Globals:
  Function:
    Runtime: python3.13
    Architectures: [x86_64]
    Timeout: 25
    MemorySize: 256
    Environment:
      Variables:
        STAGE_NAME: !Ref StageName
        # Empty in AWS; overridden only by the local SAM environment file.
        DYNAMODB_ENDPOINT_URL: ''
        CIG_LOCAL: 'false'
        # Fixture observations require a separate local-only override; never use cloud credentials locally.
        INVENTORY_PROVIDER: aws
        CIG_FIXTURE_SCENARIO: benign
        TOPOLOGY_ENABLED: 'true'
        CONFIG_ENABLED: !Ref EnableConfig
        LAMBDA_INVENTORY_ENABLED: !Ref EnableLambdaInventory
        TAG_INVENTORY_ENABLED: !Ref EnableTagInventory

Resources:
  # Cognito sign-up is admin-only so public visitors cannot create accounts to inspect your AWS inventory.
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub cloud-intent-guardian-${StageName}-users
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub cloud-intent-guardian-${StageName}-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [!Ref CognitoCallbackUrl]
      LogoutURLs: [!Ref CognitoLogoutUrl]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub cig-${AWS::AccountId}-${AWS::Region}-${StageName}
      ManagedLoginVersion: 1

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      DefinitionBody:
        openapi: '3.0.1'
        info:
          title: Cloud Intent Guardian API
          version: '1.0'
        paths: {}
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - PATCH
          - OPTIONS
        MaxAge: 600
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient

  IntentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloud-intent-guardian-${StageName}-intents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: intentId
          AttributeType: S
      KeySchema:
        - AttributeName: intentId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  FindingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloud-intent-guardian-${StageName}-findings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: findingId
          AttributeType: S
      KeySchema:
        - AttributeName: findingId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  EvaluationsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloud-intent-guardian-${StageName}-evaluations
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: evaluationId
          AttributeType: S
      KeySchema:
        - AttributeName: evaluationId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: health.app.lambda_handler
      Description: Public liveness endpoint only; returns no account details.
      Events:
        HealthRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/health
            Method: GET
            Auth:
              Authorizer: NONE

  StatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: status.app.lambda_handler
      Description: Authenticated AWS account and source readiness status.
      Policies:
        - Statement:
            - Effect: Allow
              Action: sts:GetCallerIdentity
              Resource: '*'
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - rds:DescribeDBInstances
                - s3:ListAllMyBuckets
              Resource: '*'
        - !If
          - ConfigEnabled
          - Statement:
              - Effect: Allow
                Action: [config:DescribeConfigurationRecorders, config:DescribeConfigurationRecorderStatus]
                Resource: '*'
          - !Ref AWS::NoValue
      Events:
        StatusRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/system/status
            Method: GET

  ResourcesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: resources.app.lambda_handler
      Description: Read-only inventory from EC2, VPC, security groups, RDS and S3 APIs.
      # Intent comparison is a read; this function must never change intent or AWS resources.
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IntentsTable
        - Statement:
            - Effect: Allow
              Action:
                - sts:GetCallerIdentity
                - ec2:DescribeInstances
                - ec2:DescribeVpcs
                - ec2:DescribeSubnets
                - ec2:DescribeSecurityGroups
                - rds:DescribeDBInstances
                - rds:DescribeDBSubnetGroups
                - s3:ListAllMyBuckets
                - s3:GetBucketLocation
                - s3:GetPublicAccessBlock
                - s3:GetBucketPolicyStatus
              Resource: '*'
        - !If
          - LambdaInventoryEnabled
          - Statement:
              - Effect: Allow
                Action: [lambda:ListFunctions]
                Resource: '*'
          - !Ref AWS::NoValue
        - !If
          - TagInventoryEnabled
          - Statement:
              - Effect: Allow
                Action: [rds:ListTagsForResource, s3:GetBucketTagging]
                Resource: '*'
          - !Ref AWS::NoValue
      Events:
        ResourcesRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/resources
            Method: GET
            TimeoutInMillis: 29000
        GraphRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/architecture/graph
            Method: GET
            TimeoutInMillis: 29000

  ViewsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: views.app.lambda_handler
      Description: Stored findings detail and dashboard summary without live discovery.
      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTable
          EVALUATIONS_TABLE: !Ref EvaluationsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FindingsTable
        - DynamoDBReadPolicy:
            TableName: !Ref EvaluationsTable
      Events:
        DashboardRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/dashboard/summary
            Method: GET
        FindingDetailRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/findings/{findingId}
            Method: GET

  FindingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: findings.app.lambda_handler
      Description: Lists stored findings with cursor pagination.
      Environment:
        Variables:
          FINDINGS_TABLE: !Ref FindingsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref FindingsTable
      Events:
        FindingsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/findings
            Method: GET

  IntentsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: intents.app.lambda_handler
      Description: Lists and creates draft JSON intent manifests.
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IntentsTable
      Events:
        ListIntentsRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/intents
            Method: GET
        CreateIntentRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/intents
            Method: POST

  IntentDetailFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: intent_detail.app.lambda_handler
      Description: Retrieves one intent manifest.
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref IntentsTable
      Events:
        IntentDetailRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/intents/{intentId}
            Method: GET

  ApproveIntentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: approve_intent.app.lambda_handler
      Description: Explicitly approves a validated draft intent.
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IntentsTable
      Events:
        ApproveIntentRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/intents/{intentId}/approve
            Method: POST

  EvaluationsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: evaluations.app.lambda_handler
      Description: Runs deterministic intent constraints against live AWS resource inventory.
      Timeout: 29
      MemorySize: 512
      Environment:
        Variables:
          INTENTS_TABLE: !Ref IntentsTable
          FINDINGS_TABLE: !Ref FindingsTable
          EVALUATIONS_TABLE: !Ref EvaluationsTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref IntentsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref FindingsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref EvaluationsTable
        - Statement:
            - Effect: Allow
              Action:
                - ec2:DescribeInstances
                - ec2:DescribeVpcs
                - ec2:DescribeSubnets
                - ec2:DescribeSecurityGroups
                - rds:DescribeDBInstances
                - rds:DescribeDBSubnetGroups
                - s3:ListAllMyBuckets
                - s3:GetBucketLocation
                - s3:GetPublicAccessBlock
                - s3:GetBucketPolicyStatus
                - sts:GetCallerIdentity
              Resource: '*'
        - !If
          - LambdaInventoryEnabled
          - Statement:
              - Effect: Allow
                Action: [lambda:ListFunctions]
                Resource: '*'
          - !Ref AWS::NoValue
        - !If
          - TagInventoryEnabled
          - Statement:
              - Effect: Allow
                Action: [rds:ListTagsForResource, s3:GetBucketTagging]
                Resource: '*'
          - !Ref AWS::NoValue
      Events:
        RunEvaluationRoute:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /v1/evaluations
            Method: POST
            TimeoutInMillis: 29000

Outputs:
  ApiUrl:
    Description: Base URL for the Cloud Intent Guardian API.
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  AwsRegion:
    Description: AWS Region used by this deployment.
    Value: !Ref AWS::Region
  CognitoUserPoolId:
    Description: Cognito User Pool ID used by the frontend.
    Value: !Ref UserPool
  CognitoUserPoolClientId:
    Description: Cognito public web client ID (not a secret).
    Value: !Ref UserPoolClient
  CognitoDomain:
    Description: Public Cognito hosted login domain for the frontend OAuth flow.
    Value: !Sub '${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  IntentsTableName:
    Value: !Ref IntentsTable
  FindingsTableName:
    Value: !Ref FindingsTable
  EvaluationsTableName:
    Value: !Ref EvaluationsTable
